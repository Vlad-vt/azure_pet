{{- if not .Values.database.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "skumatch.dbSecretName" . }}
  labels:
    {{- include "skumatch.labels" . | nindent 4 }}
type: Opaque
stringData:
  username: {{ .Values.database.username | quote }}
  password: {{ required "database.password or database.existingSecret is required" .Values.database.password | quote }}
{{- end }}
